<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KLEEN | Premium Cleaning Products</title>

<!-- Bootstrap 5 CSS CDN for responsive grid layout -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
:root {
    --primary: #0284c7;
    --primary-dark: #0369a1;
    --primary-light: #e0f2fe;
    --surface: #ffffff;
    --bg-base: #f8fafc;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --border-subtle: #e2e8f0;
    --radius: 12px;
}

body {
    background: var(--bg-base);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

/* HEADER */
header {
    background: var(--surface);
    border-bottom: 1px solid var(--border-subtle);
    position: sticky;
    top: 0;
    z-index: 100;
}

.navbar-custom {
    max-width: 1400px;
    margin: auto;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: var(--primary);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 18px;
}

.logo h1 {
    font-size: 20px;
    letter-spacing: 1px;
    font-weight: 800;
    margin: 0;
    color: var(--text-main);
}

.nav-right {
    display: flex;
    align-items: center;
    gap: 12px;
}

.live-badge {
    background: var(--primary-light);
    color: var(--primary-dark);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
}

.live-dot {
    width: 6px;
    height: 6px;
    background: #10b981;
    border-radius: 50%;
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0% { transform: scale(0.95); opacity: 0.8; }
    50% { transform: scale(1.3); opacity: 1; }
    100% { transform: scale(0.95); opacity: 0.8; }
}

.cart-button {
    border: none;
    background: var(--text-main);
    color: white;
    padding: 10px 16px;
    border-radius: var(--radius);
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.2s;
}

.cart-button:hover {
    background: var(--primary);
}

/* CUSTOM SIDEBAR & CARD STYLING */
.card-box {
    background: var(--surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius);
    padding: 20px;
}

.filter-pill {
    width: 100%;
    text-align: left;
    border: none;
    background: transparent;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 4px;
}

.filter-pill:hover {
    background: var(--bg-base);
    color: var(--text-main);
}

.filter-pill.active {
    background: var(--primary-light);
    color: var(--primary-dark);
    font-weight: 600;
}

/* PRODUCT TILE GRID */
.product-card {
    background: var(--surface);
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--border-subtle);
    display: flex;
    flex-direction: column;
    height: 100%;
    transition: transform 0.2s, box-shadow 0.2s;
}

.product-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    border-color: #cbd5e1;
}

.product-image {
    height: 160px;
    background: #f8fafc;
    background-image: 
        linear-gradient(90deg, #f1f5f9 1px, transparent 1px),
        linear-gradient(0deg, #f1f5f9 1px, transparent 1px);
    background-size: 30px 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
    position: relative;
    border-bottom: 1px solid var(--border-subtle);
}

.product-image img {
    max-height: 100%;
    max-width: 100%;
    object-fit: contain;
}

.badge-custom {
    position: absolute;
    top: 10px;
    left: 10px;
    background: var(--primary-light);
    color: var(--primary-dark);
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
}

.product-info {
    padding: 14px;
    display: flex;
    flex-direction: column;
    flex: 1;
}

.product-info h3 {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 2px;
}

.size {
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 500;
    margin-bottom: 10px;
}

.product-footer {
    margin-top: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 8px;
    border-top: 1px solid var(--bg-base);
}

.price {
    font-size: 15px;
    font-weight: 800;
    color: var(--primary-dark);
}

.add-btn {
    border: 1px solid var(--border-subtle);
    background: var(--bg-base);
    color: var(--text-main);
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: 12px;
    transition: all 0.2s;
}

.add-btn:hover {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
}

/* CART PANEL */
.cart-panel {
    position: fixed;
    right: -420px;
    top: 0;
    width: min(400px, 100%);
    height: 100vh;
    background: var(--surface);
    z-index: 200;
    box-shadow: -10px 0 30px rgba(0,0,0,0.1);
    transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex;
    flex-direction: column;
}

.cart-panel.open {
    right: 0;
}

.cart-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.cart-items {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
}

.cart-item {
    border-bottom: 1px solid var(--border-subtle);
    padding: 12px 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.qty-btn {
    border: 1px solid var(--border-subtle);
    background: white;
    width: 24px;
    height: 24px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
}

.remove {
    color: #ef4444;
    border: none;
    background: none;
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
    margin-left: auto;
}

/* TOAST NOTIFICATION */
.toast-msg {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--text-main);
    color: white;
    padding: 10px 20px;
    border-radius: 30px;
    font-size: 13px;
    font-weight: 600;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 300;
    pointer-events: none;
}

.toast-msg.show {
    transform: translateX(-50%) translateY(0);
}
</style>
</head>

<body>

<header>
    <div class="navbar-custom">
        <div class="logo">
            <div class="logo-icon">K</div>
            <h1>KLEEN</h1>
        </div>

        <div class="nav-right">
            <!-- REAL LIVE VISITOR BADGE -->
            <div class="live-badge">
                <div class="live-dot"></div>
                <span id="viewerCount">--</span> viewing
            </div>

            <button class="cart-button" onclick="openCart()">
                🛒 Cart (<span id="cartCount">0</span>)
            </button>
        </div>
    </div>
</header>

<!-- RESPONSIVE BOOTSTRAP GRID CONTAINER -->
<div class="container my-4">
    <div class="row g-4">
        
        <!-- SIDEBAR: SEARCH & CATEGORIES -->
        <div class="col-12 col-lg-4">
            <div class="card-box sticky-top" style="top: 85px;">
                <h5 class="fw-bold mb-3" style="font-size: 15px;">Search</h5>
                <div class="input-group mb-4">
                    <span class="input-group-text bg-light border-end-0">🔍</span>
                    <input type="text" class="form-control bg-light border-start-0 shadow-none" id="search" placeholder="Search items..." oninput="filterProducts()">
                </div>

                <h5 class="fw-bold mb-3" style="font-size: 15px;">Categories</h5>
                <div id="filterPills">
                    <button class="filter-pill active" onclick="setCategory('All', this)">All Products</button>
                    <button class="filter-pill" onclick="setCategory('Laundry', this)">Laundry</button>
                    <button class="filter-pill" onclick="setCategory('Dish', this)">Dishwashing</button>
                    <button class="filter-pill" onclick="setCategory('Floor', this)">Floors & Tiles</button>
                    <button class="filter-pill" onclick="setCategory('Bleach', this)">Bleach & Disinfectants</button>
                    <button class="filter-pill" onclick="setCategory('Car', this)">Car Care</button>
                </div>
            </div>
        </div>

        <!-- MAIN CATALOG AREA -->
        <div class="col-12 col-lg-8">
            <div class="card-box mb-4 d-flex justify-content-between align-items-center">
                <div>
                    <h2 class="fw-bold mb-0" style="font-size: 18px;">Store Catalog</h2>
                    <span class="text-muted" style="font-size: 12px;" id="productCount">Showing all items</span>
                </div>
            </div>

            <!-- Product Grid -->
            <div class="row row-cols-1 row-cols-sm-2 row-cols-xl-3 g-3" id="products"></div>
        </div>

    </div>
</div>

<!-- CART PANEL -->
<div class="cart-panel" id="cartPanel">
    <div class="cart-header">
        <h2 class="fw-bold m-0" style="font-size: 18px;">Your Cart</h2>
        <button class="btn btn-light rounded-circle p-1 lh-1" onclick="closeCart()" style="width: 32px; height: 32px;">✕</button>
    </div>

    <div class="cart-items" id="cartItems"></div>

    <div class="p-3 bg-light border-top">
        <div class="fw-bold mb-2" style="font-size: 12px;">Delivery Method</div>
        <div class="row g-2">
            <div class="col-6">
                <button class="w-100 btn btn-sm btn-outline-primary active fw-semibold" id="pickupBtn" onclick="setFulfillment('pickup')">Pickup (Free)</button>
            </div>
            <div class="col-6">
                <button class="w-100 btn btn-sm btn-outline-primary fw-semibold" id="deliveryBtn" onclick="setFulfillment('delivery')">Delivery (R50)</button>
            </div>
        </div>
    </div>

    <div class="p-4 bg-white border-top">
        <div class="d-flex justify-content-between text-muted mb-1" style="font-size: 13px;">
            <span>Subtotal</span>
            <span>R<span id="cartSubtotal">0.00</span></span>
        </div>
        <div class="d-flex justify-content-between text-muted mb-2" id="deliveryRow" style="display: none !important; font-size: 13px;">
            <span>Delivery Fee</span>
            <span>R50.00</span>
        </div>
        <div class="d-flex justify-content-between fw-bold fs-5 mb-3 pt-2 border-top border-dashed">
            <span>Total</span>
            <span>R<span id="cartTotal">0.00</span></span>
        </div>
        <button class="w-100 btn btn-success fw-bold py-2" onclick="orderWhatsApp()">
            💬 Order on WhatsApp
        </button>
    </div>
</div>

<!-- TOAST -->
<div class="toast-msg" id="toastNotification">Added to cart</div>

<footer class="bg-white border-top text-center py-4 mt-5 text-muted">
    <h3 class="fw-bold text-dark fs-6 mb-1">KLEEN</h3>
    <p class="mb-0" style="font-size: 12px;">Modern cleaning essentials for home & auto. Orders processed via WhatsApp.</p>
</footer>

<script>
const whatsappNumber = "27748278881";
const deliveryFee = 50.00;
let fulfillmentType = "pickup";

// Product paths configured directly from the root folder (Assets/ prefix removed)
const products = [
    { name: "French Laundry", category: "Laundry", size: "5L", price: 150, image: "French-Laundry-Just-P....jpg", badge: "Value Size" },
    { name: "French Laundry", category: "Laundry", size: "750ml", price: 31, image: "Handy-Kleen-750ml.jpg" },
    { name: "Dishwashing Liquid", category: "Dish", size: "5L", price: 125, image: "Kleen-Bleach-5L.jpg", badge: "Value Size" },
    { name: "Dishwashing Liquid Refill", category: "Dish", size: "Refill", price: 23, image: "Kleen-Bleach-750ml.jpg" },
    { name: "Dishwashing Liquid", category: "Dish", size: "750ml", price: 25, image: "Kleen-Car-Shampoo-5L.....jpg" },
    { name: "Soft Spring Fabric Softener", category: "Laundry", size: "5L", price: 110, image: "Kleen-Cherry-Pine-5L.jpg" },
    { name: "Soft Spring Fabric Softener", category: "Laundry", size: "750ml", price: 29, image: "Kleen-Cherry-Pine-750....jpg" },
    { name: "Thick Bleach", category: "Bleach", size: "5L", price: 120, image: "Kleen-Pine-Disinfectant....jpg" },
    { name: "Thick Bleach", category: "Bleach", size: "750ml", price: 29, image: "Kleen-Pine-Disinfectant.jpg" },
    { name: "Standard Bleach", category: "Bleach", size: "5L", price: 75, image: "Kleen-Pine-Gel-500ml.jpg" },
    { name: "Standard Bleach", category: "Bleach", size: "750ml", price: 20, image: "Kleen-Soft-Spring-5L.jpg" },
    { name: "Tile Cleaner", category: "Floor", size: "5L", price: 130, image: "Kleen-Soft-Spring-750....jpg" },
    { name: "Tile Cleaner", category: "Floor", size: "750ml", price: 30, image: "Kleen-Thick-Bleach-5L.j....jpg" },
    { name: "Pine Disinfectant", category: "Floor", size: "5L", price: 99, image: "Kleen-Thick-Bleach-750....jpg" },
    { name: "Pine Disinfectant", category: "Floor", size: "750ml", price: 30, image: "Kleen-Tile-Cleaner-5L.jpg" },
    { name: "Cherry Pine", category: "Floor", size: "5L", price: 130, image: "Kleen-Tile-Cleaner-750....jpg" },
    { name: "Cherry Pine", category: "Floor", size: "750ml", price: 30, image: "Handy-Kleen-5L.jpg" },
    { name: "Handy Kleen", category: "Floor", size: "5L", price: 99, image: "Handy-Kleen-750ml.jpg" },
    { name: "Car Shampoo", category: "Car", size: "5L", price: 99, image: "Kleen-Car-Shampoo-5L.....jpg", badge: "Auto" },
    { name: "Pine Gel", category: "Floor", size: "500ml", price: 30, image: "Kleen-Pine-Gel-500ml.jpg" }
];

let cart = [];
let currentCategory = "All";

function displayProducts(list = products) {
    const container = document.getElementById("products");
    const countEl = document.getElementById("productCount");
    container.innerHTML = "";

    countEl.textContent = `Showing ${list.length} item${list.length === 1 ? '' : 's'}`;

    if (list.length === 0) {
        container.innerHTML = `
            <div class="col-12 text-center py-5 text-muted">
                <h5>No products found</h5>
                <p class="mb-0">Try searching for something else or change filter.</p>
            </div>
        `;
        return;
    }

    list.forEach((product) => {
        const originalIndex = products.indexOf(product);

        container.innerHTML += `
        <div class="col">
            <div class="product-card">
                <div class="product-image">
                    ${product.badge ? `<span class="badge-custom">${product.badge}</span>` : ''}
                    <img src="${product.image}" alt="${product.name} ${product.size}" loading="lazy">
                </div>
                <div class="product-info">
                    <h3>${product.name}</h3>
                    <div class="size">${product.size}</div>
                    <div class="product-footer">
                        <div class="price">R${product.price.toFixed(2)}</div>
                        <button class="add-btn" onclick="addToCart(${originalIndex})">Add</button>
                    </div>
                </div>
            </div>
        </div>
        `;
    });
}

function setCategory(category, element) {
    currentCategory = category;
    document.querySelectorAll('.filter-pill').forEach(pill => pill.classList.remove('active'));
    element.classList.add('active');
    filterProducts();
}

function filterProducts() {
    const query = document.getElementById("search").value.toLowerCase();
    const filtered = products.filter(product => {
        const matchesCategory = currentCategory === "All" || product.category === currentCategory;
        const matchesQuery = product.name.toLowerCase().includes(query) || product.size.toLowerCase().includes(query);
        return matchesCategory && matchesQuery;
    });
    displayProducts(filtered);
}

function showToast(message) {
    const toast = document.getElementById("toastNotification");
    toast.textContent = message;
    toast.classList.add("show");
    setTimeout(() => {
        toast.classList.remove("show");
    }, 2000);
}

function addToCart(index) {
    const product = products[index];
    const existing = cart.find(item => item.name === product.name && item.size === product.size);

    if (existing) {
        existing.quantity++;
    } else {
        cart.push({ ...product, quantity: 1 });
    }

    updateCart();
    showToast(`Added ${product.name} (${product.size})`);
}

function setFulfillment(type) {
    fulfillmentType = type;
    if (type === 'pickup') {
        document.getElementById('pickupBtn').classList.add('active');
        document.getElementById('deliveryBtn').classList.remove('active');
        document.getElementById('deliveryRow').style.setProperty('display', 'none', 'important');
    } else {
        document.getElementById('deliveryBtn').classList.add('active');
        document.getElementById('pickupBtn').classList.remove('active');
        document.getElementById('deliveryRow').style.setProperty('display', 'flex', 'important');
    }
    updateCartTotals();
}

function updateCart() {
    const container = document.getElementById("cartItems");
    const count = cart.reduce((total, item) => total + item.quantity, 0);
    document.getElementById("cartCount").textContent = count;

    if (cart.length === 0) {
        container.innerHTML = `
            <div class="text-center text-muted py-5">
                <h5 class="text-dark">Your cart is empty</h5>
                <p class="mb-0" style="font-size: 13px;">Add some products to get started!</p>
            </div>
        `;
        document.getElementById("cartSubtotal").textContent = "0.00";
        document.getElementById("cartTotal").textContent = "0.00";
        return;
    }

    container.innerHTML = "";

    cart.forEach((item, index) => {
        const subtotal = item.price * item.quantity;

        container.innerHTML += `
        <div class="cart-item">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <div class="fw-bold" style="font-size: 13px;">${item.name}</div>
                    <div class="text-muted" style="font-size: 11px;">${item.size}</div>
                </div>
                <div class="fw-bold text-primary" style="font-size: 13px;">R${subtotal.toFixed(2)}</div>
            </div>
            <div class="d-flex align-items-center gap-2 mt-1">
                <button class="qty-btn" onclick="changeQuantity(${index}, -1)">−</button>
                <span style="font-size: 13px; font-weight: 600;">${item.quantity}</span>
                <button class="qty-btn" onclick="changeQuantity(${index}, 1)">+</button>
                <button class="remove" onclick="removeItem(${index})">Remove</button>
            </div>
        </div>
        `;
    });

    updateCartTotals();
}

function updateCartTotals() {
    let subtotal = 0;
    cart.forEach(item => {
        subtotal += item.price * item.quantity;
    });

    let total = subtotal;
    if (fulfillmentType === 'delivery' && cart.length > 0) {
        total += deliveryFee;
    }

    document.getElementById("cartSubtotal").textContent = subtotal.toFixed(2);
    document.getElementById("cartTotal").textContent = total.toFixed(2);
}

function changeQuantity(index, amount) {
    cart[index].quantity += amount;
    if (cart[index].quantity <= 0) {
        cart.splice(index, 1);
    }
    updateCart();
}

function removeItem(index) {
    cart.splice(index, 1);
    updateCart();
}

function openCart() {
    document.getElementById("cartPanel").classList.add("open");
}

function closeCart() {
    document.getElementById("cartPanel").classList.remove("open");
}

function orderWhatsApp() {
    if (cart.length === 0) {
        alert("Your cart is empty.");
        return;
    }

    let message = "🧼 *KLEEN ORDER*%0A%0A";
    let subtotal = 0;

    cart.forEach(item => {
        const itemSubtotal = item.price * item.quantity;
        subtotal += itemSubtotal;
        message += `• ${item.name} (${item.size}) x${item.quantity} — R${itemSubtotal.toFixed(2)}%0A`;
    });

    message += `%0ASubtotal: R${subtotal.toFixed(2)}`;
    
    if (fulfillmentType === 'delivery') {
        let finalTotal = subtotal + deliveryFee;
        message += `%0AFulfillment: *Local Delivery* (R${deliveryFee.toFixed(2)})`;
        message += `%0A*Total: R${finalTotal.toFixed(2)}*%0A%0A`;
        message += `Hi, I would like to place this order for delivery. Please confirm availability and share your payment details.`;
    } else {
        message += `%0AFulfillment: *Store Pickup* (Free)`;
        message += `%0A*Total: R${subtotal.toFixed(2)}*%0A%0A`;
        message += `Hi, I would like to place this order for store pickup. Please confirm when ready.`;
    }

    const url = `https://wa.me/${whatsappNumber}?text=${message}`;
    window.open(url, "_blank");
}

// REAL LIVE VIEWER COUNTER API INTEGRATION
async function initRealLiveCounter() {
    const namespace = "kleen-store-yusuf"; 
    const key = "active_viewers";
    
    try {
        const response = await fetch(`https://api.counterapi.dev/v1/${namespace}/${key}/up`);
        const data = await response.json();
        
        if (data && data.count) {
            document.getElementById("viewerCount").textContent = data.count;
        }
    } catch (error) {
        document.getElementById("viewerCount").textContent = "1";
    }
}

// Initial Load & Real Counter Trigger
displayProducts();
updateCart();
initRealLiveCounter();
</script>

</body>
</html>
